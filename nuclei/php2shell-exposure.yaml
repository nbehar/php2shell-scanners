id: php2shell-possible-exposure

info:
  name: PHP2Shell - Potential Exposure by Disclosed PHP Version
  author: OpenAI Codex
  severity: critical
  description: >
    An HTTP response advertises a PHP runtime version in an upstream-affected
    range for CVE-2026-109618 and CVE-2026-109619. This low-confidence finding
    is based only on a version banner and does not prove that the responding PHP
    runtime is vulnerable or exploitable. Banners can be stale, suppressed, or
    supplied by an intermediary, and vendor packages may backport the fixes
    without changing the advertised upstream version.
  impact: >
    The underlying vulnerabilities are rated critical (CVSS v4.0 9.2) and can
    lead to unauthenticated remote code execution in affected configurations.
  remediation: >
    Verify the PHP binary and package serving this site, including the vendor
    package changelog when a distribution suffix or backport is involved.
    Upgrade to PHP 8.2.35, 8.3.36, 8.4.27, or 8.5.12 as appropriate, or to a
    vendor package that explicitly contains both fixes, then restart all PHP
    workers and the web server as applicable.
  reference:
    - https://www.php.net/archive/2026.php#2026-10-21-5
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  classification:
    cvss-metrics: CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N
    cvss-score: 9.2
    cve-id: CVE-2026-109618,CVE-2026-109619
    cwe-id: CWE-416,CWE-755,CWE-824,CWE-1325,CWE-1419
  metadata:
    max-request: 1
    verified: true
    confidence: low
    vendor: php
    product: php
  tags: php,php2shell,cve,cve2026,exposure,version

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    disable-cookie: true
    matchers:
      - type: regex
        name: upstream-affected-version
        part: header
        condition: or
        regex:
          - '(?im)^(?:x-powered-by|server):[^\r\n]*?\bPHP/(?:[0-7]\.[0-9]+\.[0-9]+|8\.[01]\.[0-9]+)(?:[A-Za-z][0-9A-Za-z.-]*|[-~+][0-9A-Za-z.+~-]+)?(?:[^0-9A-Za-z.+~-]|$)'
          - '(?im)^(?:x-powered-by|server):[^\r\n]*?\bPHP/8\.2\.(?:(?:[0-9]|[12][0-9]|3[0-4])(?:[A-Za-z][0-9A-Za-z.-]*|[-~+][0-9A-Za-z.+~-]+)?|35(?:[-~.]?(?:alpha|beta|rc|dev|snapshot|pre(?:view)?)[0-9A-Za-z.+~-]*))(?:[^0-9A-Za-z.+~-]|$)'
          - '(?im)^(?:x-powered-by|server):[^\r\n]*?\bPHP/8\.3\.(?:(?:[0-9]|[12][0-9]|3[0-5])(?:[A-Za-z][0-9A-Za-z.-]*|[-~+][0-9A-Za-z.+~-]+)?|36(?:[-~.]?(?:alpha|beta|rc|dev|snapshot|pre(?:view)?)[0-9A-Za-z.+~-]*))(?:[^0-9A-Za-z.+~-]|$)'
          - '(?im)^(?:x-powered-by|server):[^\r\n]*?\bPHP/8\.4\.(?:(?:[0-9]|1[0-9]|2[0-6])(?:[A-Za-z][0-9A-Za-z.-]*|[-~+][0-9A-Za-z.+~-]+)?|27(?:[-~.]?(?:alpha|beta|rc|dev|snapshot|pre(?:view)?)[0-9A-Za-z.+~-]*))(?:[^0-9A-Za-z.+~-]|$)'
          - '(?im)^(?:x-powered-by|server):[^\r\n]*?\bPHP/8\.5\.(?:(?:[0-9]|1[01])(?:[A-Za-z][0-9A-Za-z.-]*|[-~+][0-9A-Za-z.+~-]+)?|12(?:[-~.]?(?:alpha|beta|rc|dev|snapshot|pre(?:view)?)[0-9A-Za-z.+~-]*))(?:[^0-9A-Za-z.+~-]|$)'
    extractors:
      - type: regex
        name: php_version
        part: header
        group: 1
        regex:
          - '(?im)^(?:x-powered-by|server):[^\r\n]*?\bPHP/([0-9]+\.[0-9]+\.[0-9]+(?:[A-Za-z][0-9A-Za-z.-]*|[-~+][0-9A-Za-z.+~-]+)?)(?:[^0-9A-Za-z.+~-]|$)'
